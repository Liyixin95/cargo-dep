[package]
name = "dep"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cargo_metadata = "0.19.1"
clap = { version = "4.0.29", features = ["derive"] }


[profile.release]
strip = true
panic = "abort"
lto = true
opt-level = "z"
